# Local-device permission check only. Separate from TresFort and its release scheme.
name: FeedbackVerification
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  FeedbackVerification:
    type: application
    platform: iOS
    sources:
      - FeedbackVerification
      - TresFort/WorkoutFeedback.swift
      - TresFort/OnDeviceFeedbackTranscriber.swift
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.nmarkspdx.tresfort.feedbackverification
        DEVELOPMENT_TEAM: 8BA2RY6RCA
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Feedback Check
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record a short local verification phrase. Audio is discarded.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Create an editable transcript on this iPhone for a local verification check.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  FeedbackVerification:
    build:
      targets:
        FeedbackVerification: all
    run:
      config: Debug
